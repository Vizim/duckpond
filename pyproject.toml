[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duckpond"
version = "0.3.0"
description = "One fzf picker for Claude Code, Codex and Hermes sessions, across every project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["claude-code", "codex", "hermes", "fzf", "sessions"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
aisp = "duckpond.cli:main"
duckpond = "duckpond.cli:main"

[project.urls]
Homepage = "https://github.com/Vizim/duckpond"

[tool.setuptools.packages.find]
include = ["duckpond*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
duckpond = ["assets/*"]
