[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-picker"
version = "0.3.0"
description = "One fzf picker for Claude Code, Codex and Hermes sessions, across every project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["claude-code", "codex", "hermes", "fzf", "sessions"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
aisp = "agent_picker.cli:main"

[project.urls]
Homepage = "https://github.com/Vizim/ai-session-picker"

[tool.setuptools]
packages = ["agent_picker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
