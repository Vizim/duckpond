name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - run: duckpond --version
      - run: duckpond doctor
        continue-on-error: true

  installer:
    name: installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh install.sh
          ~/.local/bin/duckpond --version
          ~/.local/bin/duckpond doctor || true
          test -f ~/.local/share/applications/duckpond.desktop || test -d "$HOME/Applications/Duckpond.app"
          sh install.sh --uninstall
          test ! -e ~/.local/bin/duckpond
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1
          $duckpond = Join-Path $env:LOCALAPPDATA 'duckpond\venv\Scripts\duckpond.exe'
          & $duckpond --version
          & $duckpond doctor; if ($LASTEXITCODE -ne 0) { Write-Host 'doctor: no agents on the runner' }
          Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Duckpond.lnk')
          .\install.ps1 -Uninstall
          if (Test-Path $duckpond) { throw 'duckpond still installed' }
